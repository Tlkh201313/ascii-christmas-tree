<script id="song" type="application/octet-stream">__SONG_B64__</script>
<script>
'use strict';

/* ---------- maths helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const frac = x => x - Math.floor(x);
function easeIO(x) { x = clamp(x); return x < 0.5 ? 0.5 * Math.pow(2 * x, 1.5) : 1 - 0.5 * Math.pow(2 - 2 * x, 1.5); }
function easeIOinv(e) { e = clamp(e); return e < 0.5 ? 0.5 * Math.pow(2 * e, 1 / 1.5) : 1 - 0.5 * Math.pow(2 - 2 * e, 1 / 1.5); }
function easeOutBack(x) { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeOut3(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }

function hi(n) {
  n |= 0;
  n = Math.imul(n ^ (n >>> 16), 0x7feb352d);
  n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function h3(a, b, c) { return hi(Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x61c88647)); }
function vnoiseW(x, n, seed) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = ((i % n) + n) % n, b = (((i + 1) % n) + n) % n;
  return hi(a * 7919 + seed * 104729) * (1 - u) + hi(b * 7919 + seed * 104729) * u;
}
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry(20261224);

const RAMP = [318, 282, 228, 190, 150, 56, 38, 56, 150, 190, 228, 282];
function rampHue(x) {
  const p = frac(x) * 12, i = Math.floor(p), w = p - i;
  return RAMP[i] + (RAMP[(i + 1) % 12] - RAMP[i]) * w;
}

const SN = 8192, SM = SN - 1, SK = SN / TAU;
const SIN = new Float32Array(SN), COS = new Float32Array(SN);
for (let i = 0; i < SN; i++) { SIN[i] = Math.sin(i / SK); COS[i] = Math.cos(i / SK); }

/* ---------- colour state ---------- */
let _r = 0, _g = 0, _b = 0;
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360 / 60; s = clamp(s / 100); l = clamp(l / 100);
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h % 2) - 1)), m = l - c / 2;
  let r, g, b;
  if (h < 1) { r = c; g = x; b = 0; } else if (h < 2) { r = x; g = c; b = 0; }
  else if (h < 3) { r = 0; g = c; b = x; } else if (h < 4) { r = 0; g = x; b = c; }
  else if (h < 5) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
  _r = (r + m) * 255 + 0.5 | 0; _g = (g + m) * 255 + 0.5 | 0; _b = (b + m) * 255 + 0.5 | 0;
}
function mixRGB(r, g, b, u) { _r = _r + (r - _r) * u + 0.5 | 0; _g = _g + (g - _g) * u + 0.5 | 0; _b = _b + (b - _b) * u + 0.5 | 0; }

const ch = s => s.charCodeAt(0);
const C_AT = ch('@'), C_HASH = ch('#'), C_8 = ch('8'), C_AMP = ch('&'), C_PCT = ch('%'), C_PLUS = ch('+'),
  C_COLON = ch(':'), C_DOT = ch('.'), C_STAR = ch('*'), C_DASH = ch('-'), C_PIPE = ch('|'), C_SL = ch('/'),
  C_BS = ch('\\'), C_EQ = ch('='), C_O = ch('O'), C_o = ch('o'), C_0 = ch('0'), C_x = ch('x');
const GL = []; for (let i = 0; i < 128; i++) GL.push(String.fromCharCode(i));
const TG = [C_8, C_AMP, C_PCT, C_HASH, C_AT];

/* ---------- canvas, grid ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const lay = document.createElement('canvas'), lctx = lay.getContext('2d');
const b1 = document.createElement('canvas'), b1c = b1.getContext('2d');
const b2 = document.createElement('canvas'), b2c = b2.getContext('2d');
const FILTER_OK = (() => { const t = document.createElement('canvas').getContext('2d'); t.filter = 'blur(2px)'; return t.filter === 'blur(2px)'; })();

let W, H, DPR, PW, CW, CH, AR, COLS, ROWS, X0, Y0, CX, LPAD, BG, FONT;
let FLOOR, BASE, TIP, TH, STAR, TILT, KD;
let CHR, CR, CG, CB, CA, DEP, TZ, TIDX, MASK;

function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  PW = Math.min(W, H * 9 / 16); CW = PW / 124; CH = CW * 1.62; AR = CW / CH;
  ROWS = Math.floor(H / CH);
  LPAD = Math.max(0, Math.ceil(((W - PW) / 2) / CW));
  COLS = 124 + 2 * LPAD;
  X0 = (W - PW) / 2 - LPAD * CW; Y0 = (H - ROWS * CH) / 2; CX = LPAD + 62;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  lay.width = cv.width; lay.height = cv.height;
  b1.width = Math.ceil(cv.width / 2); b1.height = Math.ceil(cv.height / 2);
  b2.width = Math.ceil(cv.width / 4); b2.height = Math.ceil(cv.height / 4);
  BG = ctx.createLinearGradient(0, 0, 0, cv.height);
  BG.addColorStop(0, '#323a47'); BG.addColorStop(0.55, '#394250');
  BG.addColorStop(0.86, '#4b5463'); BG.addColorStop(1, '#666e7d');
  FONT = 'bold ' + (0.95 * CH * DPR).toFixed(2) + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  const N = COLS * ROWS;
  CHR = new Uint8Array(N); CR = new Uint8ClampedArray(N); CG = new Uint8ClampedArray(N);
  CB = new Uint8ClampedArray(N); CA = new Uint8ClampedArray(N); DEP = new Float32Array(N);
  TZ = new Float32Array(N); TIDX = new Int32Array(N); MASK = new Float32Array(N);
  FLOOR = 0.845 * ROWS; BASE = 0.698 * ROWS; TIP = 0.273 * ROWS; TH = BASE - TIP; STAR = TIP - 2;
  TILT = 0.17 * AR; KD = AR * 0.28;
}

function put(x, y, c, z, a) {
  if (a < 0.04) return;
  const ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 0 || iy < 0 || ix >= COLS || iy >= ROWS) return;
  const k = iy * COLS + ix;
  if (z < DEP[k]) return;
  DEP[k] = z; CHR[k] = c; CR[k] = _r; CG[k] = _g; CB[k] = _b; CA[k] = a >= 1 ? 255 : a * 255;
}

/* halos: queued, then sprinkled into empty cells only */
const HQ = new Float32Array(500 * 7); let hq = 0;
function halo(x, y, rad, amt, h, s, l) {
  if (hq >= 500 || amt <= 0.01) return;
  const o = hq * 7; HQ[o] = x; HQ[o + 1] = y; HQ[o + 2] = rad; HQ[o + 3] = amt; HQ[o + 4] = h; HQ[o + 5] = s; HQ[o + 6] = l; hq++;
}
function flushHalos(tick) {
  for (let n = 0; n < hq; n++) {
    const o = n * 7, x = HQ[o], y = HQ[o + 1], rad = HQ[o + 2], amt = HQ[o + 3];
    const ry = rad * AR;
    const x0 = Math.max(0, Math.floor(x - rad)), x1 = Math.min(COLS - 1, Math.ceil(x + rad));
    const y0 = Math.max(0, Math.floor(y - ry)), y1 = Math.min(ROWS - 1, Math.ceil(y + ry));
    hsl(HQ[o + 4], HQ[o + 5], HQ[o + 6]);
    for (let iy = y0; iy <= y1; iy++) {
      const dy = (iy + 0.5 - y) / ry;
      for (let ix = x0; ix <= x1; ix++) {
        const k = iy * COLS + ix;
        if (CHR[k]) continue;
        const dx = (ix + 0.5 - x) / rad, d = Math.sqrt(dx * dx + dy * dy);
        if (d >= 1) continue;
        const p = (1 - d) * (1 - d) * amt;
        if (h3(ix, iy, tick + n * 31) >= p) continue;
        CHR[k] = d < 0.35 ? C_PLUS : d < 0.65 ? C_COLON : C_DOT;
        CR[k] = _r; CG[k] = _g; CB[k] = _b; CA[k] = 255 * (0.35 + 0.6 * (1 - d));
        DEP[k] = -1e9;
      }
    }
  }
}

/* ---------- tree point cloud (seeded, built once) ---------- */
const MAXR = 0.32 * 124;
const TIERS = [
  { fb: 0.00, ft: 0.34, R: 1.08, n: 13, dep: 0.30, dr: 5.5 },
  { fb: 0.20, ft: 0.50, R: 0.80, n: 11, dep: 0.34, dr: 4.6 },
  { fb: 0.37, ft: 0.63, R: 0.62, n: 10, dep: 0.38, dr: 3.8 },
  { fb: 0.52, ft: 0.75, R: 0.46, n: 8, dep: 0.42, dr: 3.0 },
  { fb: 0.66, ft: 0.87, R: 0.32, n: 7, dep: 0.48, dr: 2.3 },
  { fb: 0.79, ft: 1.00, R: 0.19, n: 6, dep: 0.52, dr: 1.6 }
];
TIERS.forEach((T, k) => {
  T.Ra = T.R / 1.08 * MAXR; T.top = k === 5; T.off = rng(); T.fbN = k < 5 ? TIERS[k + 1].fb : 2;
  T.len = []; T.bri = []; T.drp = [];
  for (let i = 0; i < T.n; i++) {
    T.len.push(0.8 + rng() * 0.26);
    T.bri.push(0.72 + rng() * 0.45);
    T.drp.push(0.65 + rng() * 0.7);
  }
});
function rT(T, u) { return T.top ? T.Ra * Math.pow(1 - u, 1.1) : T.Ra * (0.16 + 0.84 * Math.pow(1 - u, 1.5)); }
let LOBE_I = 0;
function lobe(T, a) {
  const v = a / TAU * T.n + T.off, kk = Math.floor(v), w = v - kk;
  LOBE_I = ((kk % T.n) + T.n) % T.n;
  return (1 - T.dep) + T.dep * Math.pow(Math.sin(Math.PI * w), 0.55);
}

const NB = 150000, NL = 5000;
const PF = new Float32Array(NB), PR = new Float32Array(NB), PA = new Float32Array(NB), PD = new Float32Array(NB),
  PB = new Float32Array(NB), PFR = new Float32Array(NB), PTP = new Float32Array(NB);
const PH = new Int8Array(NB), PG = new Int8Array(NB), PT = new Uint8Array(NB);
{
  let wsum = 0; TIERS.forEach(T => { T.w = Math.pow(T.Ra, 1.25) * (T.ft - T.fb); wsum += T.w; });
  let idx = 0;
  TIERS.forEach((T, k) => {
    const cnt = k === 5 ? NB - idx : Math.round(NB * T.w / wsum);
    for (let j = 0; j < cnt; j++, idx++) {
      const a = rng() * TAU, core = rng() < 0.3;
      let u, q;
      if (core) { u = rng(); q = Math.pow(rng(), 0.6) * 0.78; }
      else {
        const ring = Math.floor(rng() * 4);
        u = clamp((ring + 0.1 + rng() * 0.8) / 4 + (rng() - 0.5) * 0.05, 0, 0.995);
        q = Math.pow(rng(), 0.45);
      }
      const lb = lobe(T, a), li = LOBE_I;
      const rad = rT(T, u);
      const re = rad * lb * T.len[li];
      PF[idx] = T.fb + u * (T.ft - T.fb);
      PR[idx] = q * re;
      PA[idx] = a;
      PD[idx] = q * q * T.dr * T.drp[li] * (rad / T.Ra) * (0.6 + 0.4 * T.len[li]) + (rng() - 0.5) * 0.5;
      PT[idx] = k;
      PH[idx] = Math.round((rng() - 0.5) * 12);
      const gr = rng(); PG[idx] = gr < 0.05 ? -1 : gr < 0.1 ? 1 : 0;
      if (core) { PB[idx] = 0.05 + 0.1 * rng(); continue; }
      const lbN = (lb - (1 - T.dep)) / T.dep;
      const streak = vnoiseW(a / TAU * T.n * 6, T.n * 6, k * 11 + 3);
      const shadow = 1 - 0.8 * Math.max(sstep(T.fbN - 0.11, T.fbN - 0.035, PF[idx]), sstep(0.6, 0.92, u));
      const rim = 1 + 0.45 * (1 - sstep(0, 0.2, u)) * q;
      PB[idx] = (0.3 + 0.7 * Math.pow(q, 1.4)) * T.bri[li] * (0.62 + 0.38 * streak) * shadow * (0.55 + 0.45 * lbN) * rim;
      if (q > 0.86 && u < 0.35) {
        const cl = vnoiseW(a / TAU * T.n * 2, T.n * 2, k * 17 + 5);
        PFR[idx] = clamp((cl - 0.62) / 0.2) * clamp((q - 0.86) / 0.14) * (1 - sstep(0.2, 0.35, u));
      }
      if (q > 0.9 && u < 0.2) PTP[idx] = (q - 0.9) / 0.1 * (1 - u / 0.2);
    }
  });
}

/* tree width envelope */
const WL = new Float32Array(257);
for (let i = 0; i <= 256; i++) {
  const f = i / 256; let w = 0;
  TIERS.forEach(T => { if (f >= T.fb && f <= T.ft) w = Math.max(w, rT(T, (f - T.fb) / (T.ft - T.fb))); });
  WL[i] = w;
}
const widthAt = f => WL[(clamp(f) * 256) | 0];

/* growth timing */
const growF = t => (t < 1.8 ? 0 : easeIO((t - 1.8) / 4.35) * 1.12);
const tPass = f => 1.8 + 4.35 * easeIOinv(f / 1.12);
const TP = new Float32Array(256); for (let i = 0; i < 256; i++) TP[i] = tPass(i / 255);
const tpOf = f => TP[(clamp(f) * 255) | 0];
const T_CLOSE = tPass(0.96);
const TIER_LIT = TIERS.map(T => 5.95 + 3 * (1 - T.fb) / 1.35 + 0.45);

/* lights */
const LF = new Float32Array(NL), LR = new Float32Array(NL), LA = new Float32Array(NL), LD = new Float32Array(NL),
  LHUE = new Float32Array(NL), LW = new Float32Array(NL), LP = new Float32Array(NL), LON = new Float32Array(NL);
const LGOLD = new Uint8Array(NL);
const COMET_W = 8 * Math.PI / 3 + 0.5;
function tOnFor(f, a) {
  const tf = 5.95 + 3 * (1 - f) / 1.35; let best = 1e9;
  for (const p0 of [0, Math.PI]) {
    const d = p0 - 8 * Math.PI * (tf - 5.95) / 3 - a - 0.5 * tf;
    const m = ((d % TAU) + TAU) % TAU;
    best = Math.min(best, tf + m / COMET_W);
  }
  return best;
}
{
  let sum = 0; TIERS.forEach(T => sum += T.Ra);
  let idx = 0;
  TIERS.forEach((T, k) => {
    const cnt = k === 5 ? NL - idx : Math.round(NL * T.Ra / sum);
    const segN = T.n * 3, gone = [];
    for (let s = 0; s < segN; s++) gone.push(rng() < 0.25);
    for (let j = 0; j < cnt; j++, idx++) {
      let a, seg;
      do { a = rng() * TAU; seg = Math.floor(a / TAU * segN) % segN; } while (gone[seg]);
      const gold = rng() < 0.13;
      const u = 0.01 + rng() * 0.015 + (gold ? 0.03 : 0);
      const lb = lobe(T, a), li = LOBE_I, rad = rT(T, u);
      const q = gold ? 0.86 : 0.985;
      LF[idx] = T.fb + u * (T.ft - T.fb);
      LR[idx] = rad * lb * T.len[li] * q;
      LA[idx] = a;
      LD[idx] = q * q * T.dr * T.drp[li] * (rad / T.Ra) * (0.6 + 0.4 * T.len[li]);
      LGOLD[idx] = gold ? 1 : 0;
      LHUE[idx] = gold ? 40 : rampHue(a / TAU * 2 + k * 0.17);
      LW[idx] = 1.5 + rng() * 3; LP[idx] = rng() * TAU;
      LON[idx] = tOnFor(LF[idx], a);
    }
  });
}

/* baubles */
const BAUB = [];
TIERS.forEach((T, k) => {
  const cnt = 2 + Math.floor(rng() * 4);
  for (let j = 0; j < cnt; j++) {
    const a = (j + rng() * 0.6) / cnt * TAU, u = 0.05;
    const lb = lobe(T, a), li = LOBE_I, rad = rT(T, u), q = 0.84;
    BAUB.push({
      f: T.fb + u * (T.ft - T.fb), a, r: rad * lb * T.len[li] * q,
      d: q * q * T.dr * T.drp[li] * (rad / T.Ra) * (0.6 + 0.4 * T.len[li]) + 1.3
    });
  }
});

/* snow */
const NS = 690;
const SX = new Float32Array(NS), SY = new Float32Array(NS), SP = new Float32Array(NS), SAL = new Float32Array(NS),
  SAM = new Float32Array(NS), SFR = new Float32Array(NS), SPH = new Float32Array(NS);
for (let i = 0; i < NS; i++) {
  const d = Math.pow(rng(), 1.6);
  SX[i] = (rng() - 0.5) * 3 * 124; SY[i] = rng(); SP[i] = 0.015 + 0.035 * d; SAL[i] = 0.22 + 0.78 * d;
  SAM[i] = 0.2 + rng() * 0.6; SFR[i] = 0.3 + rng() * 0.6; SPH[i] = rng() * TAU;
}

/* dust */
const ND = 170;
const DF0 = new Float32Array(ND), DV = new Float32Array(ND), DA = new Float32Array(ND), DWV = new Float32Array(ND),
  DRR = new Float32Array(ND), DAL = new Float32Array(ND), DHU = new Float32Array(ND);
for (let i = 0; i < ND; i++) {
  DF0[i] = rng(); DV[i] = 0.02 + rng() * 0.04; DA[i] = rng() * TAU; DWV[i] = 0.2 + rng() * 0.4;
  DRR[i] = rng(); DAL[i] = 0.3 + rng() * 0.45; DHU[i] = rng();
}

/* impact sparks */
const NK = 80;
const KA = new Float32Array(NK), KV = new Float32Array(NK), KU = new Float32Array(NK), KL = new Float32Array(NK);
for (let i = 0; i < NK; i++) { KA[i] = rng() * TAU; KV[i] = 10 + rng() * 32; KU[i] = 10 + rng() * 18; KL[i] = 0.55 + rng() * 0.4; }

/* gifts */
const GIFTS = [
  { hx: 5.5, hz: 5.5, hy: 10, a: 0.35, d: 0.95, yaw: 0.3, box: [354, 72], rib: [42, 66] },
  { hx: 3.4, hz: 3.4, hy: 6.5, a: 0.35 + TAU / 5, d: 0.88, yaw: 1.1, box: [42, 62], rib: [354, 72] },
  { hx: 6.4, hz: 4.4, hy: 4.2, a: 0.35 + 2 * TAU / 5, d: 0.99, yaw: 0.7, box: [148, 58], rib: [42, 66] },
  { hx: 2.8, hz: 2.8, hy: 12, a: 0.35 + 3 * TAU / 5, d: 0.9, yaw: 0.2, box: [216, 62], rib: [42, 66] },
  { hx: 4.6, hz: 4.6, hy: 7.5, a: 0.35 + 4 * TAU / 5, d: 0.97, yaw: 1.4, box: [318, 58], rib: [42, 66] }
];
const NGP = 2400;
GIFTS.forEach(G => {
  G.U = new Float32Array(NGP); G.V = new Float32Array(NGP); G.Wp = new Float32Array(NGP);
  G.F = new Uint8Array(NGP); G.RB = new Uint8Array(NGP);
  const rw = Math.min(0.75, Math.min(G.hx, G.hz) * 0.18);
  const aX = 2 * G.hz * G.hy, aZ = 2 * G.hx * G.hy, aT = 4 * G.hx * G.hz;
  const tot = 2 * aX + 2 * aZ + aT;
  for (let i = 0; i < NGP; i++) {
    const r = rng();
    let u, v, w, face, rib = 0;
    if (i > NGP * 0.92) {
      const bs = Math.min(G.hx, G.hz) * 0.55, side = i % 2 ? 1 : -1, th = rng() * TAU;
      u = side * bs * (0.5 + 0.5 * Math.cos(th)); v = G.hy + bs * 0.45 * (1 + Math.sin(th)); w = (rng() - 0.5) * 0.6;
      face = 5; rib = 3;
    } else {
      const p = r * tot;
      if (p < aX) { face = 0; u = G.hx; w = (rng() * 2 - 1) * G.hz; v = rng() * G.hy; rib = Math.abs(w) < rw ? 1 : 0; }
      else if (p < 2 * aX) { face = 1; u = -G.hx; w = (rng() * 2 - 1) * G.hz; v = rng() * G.hy; rib = Math.abs(w) < rw ? 1 : 0; }
      else if (p < 2 * aX + aZ) { face = 2; w = G.hz; u = (rng() * 2 - 1) * G.hx; v = rng() * G.hy; rib = Math.abs(u) < rw ? 1 : 0; }
      else if (p < 2 * aX + 2 * aZ) { face = 3; w = -G.hz; u = (rng() * 2 - 1) * G.hx; v = rng() * G.hy; rib = Math.abs(u) < rw ? 1 : 0; }
      else {
        face = 4; u = (rng() * 2 - 1) * G.hx; w = (rng() * 2 - 1) * G.hz; v = G.hy;
        rib = Math.abs(w) < rw ? 2 : Math.abs(u) < rw ? 1 : 0;
      }
    }
    G.U[i] = u; G.V[i] = v; G.Wp[i] = w; G.F[i] = face; G.RB[i] = rib;
  }

      put(x, y - 2, C_PIPE, z, 0.8); put(x, y + 2, C_PIPE, z, 0.8);
    }
    hsl(0, 0, 100); put(x, y, C_AT, z + 0.1, 1);
    halo(x, y, 5, 0.6, hue, 80, 80);
  }
}

const GFR = new Uint8Array(12), GFG = new Uint8Array(12), GFB = new Uint8Array(12), GFC = new Uint8Array(6);
function gifts(t, rot) {
  if (t < 9.0) return;
  for (let g = 0; g < 5; g++) {
    const G = GIFTS[g], sc = easeOutBack((t - (9.0 + 0.26 * g)) / 0.42);
    if (sc <= 0.01) { GBOX[g] = null; continue; }
    const ht = clk - GHOP[g], hop = ht > 0 && ht < 1.4 ? Math.abs(Math.sin(ht * Math.PI / 0.42)) * 4 * Math.exp(-ht * 2.4) : 0;
    const th = rot + G.yaw, ca = Math.cos(th), sa = Math.sin(th);
    const pc = G.a + rot, d = G.d * MAXR, gx0 = d * Math.sin(pc), gz0 = d * Math.cos(pc);
    const ext = Math.max(G.hx, G.hz) * 1.42 * sc, gy0 = FLOOR + gz0 * KD;
    GBOX[g] = [CX + gx0 - ext, gy0 - (G.hy + 2) * sc * AR - hop - 1, CX + gx0 + ext, gy0 + ext * KD + 1, CX + gx0, gy0 - G.hy * sc * AR - hop, G.rib[0]];
    const NU = [1, -1, 0, 0], NW = [0, 0, 1, -1];
    for (let f = 0; f < 6; f++) {
      let b;
      if (f === 4) b = 1; else if (f === 5) b = 0.95;
      else {
        const nx = NU[f] * ca - NW[f] * sa, nz = NU[f] * sa + NW[f] * ca;
        b = 0.08 + 0.82 * Math.max(0, -0.86 * nx + 0.5 * nz);
      }
      hsl(G.box[0], G.box[1], 8 + 50 * b); GFR[f] = _r; GFG[f] = _g; GFB[f] = _b;
      hsl(G.rib[0], G.rib[1], 12 + 56 * b); GFR[f + 6] = _r; GFG[f + 6] = _g; GFB[f + 6] = _b;
      let bd = (b * 5) | 0; if (bd > 4) bd = 4; GFC[f] = TG[bd];
    }
    const U = G.U, V = G.V, Wp = G.Wp, FA = G.F, RB = G.RB;
    for (let i = 0; i < NGP; i++) {
      const u = U[i], w = Wp[i];
      const gx = gx0 + (u * ca - w * sa) * sc, gz = gz0 + (u * sa + w * ca) * sc;
      const f = FA[i], rb = RB[i];
      let c0;
      if (rb) {
        _r = GFR[f + 6]; _g = GFG[f + 6]; _b = GFB[f + 6];
        c0 = rb === 3 ? (i % 3 ? C_AT : C_HASH) : f === 4 ? (rb === 2 ? C_EQ : C_HASH) : C_PIPE;
      } else { _r = GFR[f]; _g = GFG[f]; _b = GFB[f]; c0 = GFC[f]; }
      put(CX + gx, FLOOR + gz * KD - V[i] * sc * AR - hop, c0, gz + (f === 4 || f === 5 ? 0.3 : 0), 1);
    }
  }
}

function dust(t, rot) {
  const t30 = tPass(0.3);
  if (t < t30) return;
  const on = clamp((t - t30) / 1.2);
  for (let n = 0; n < ND; n++) {
    const f = frac(DF0[n] + t * DV[n]) * 1.25 - 0.1, psi = DA[n] + t * DWV[n] + rot;
    const R = widthAt(clamp(f)) * 1.2 + 3 + DRR[n] * 8;
    const z = R * Math.cos(psi), x = CX + R * Math.sin(psi), y = BASE - f * TH + z * TILT;
    const a = DAL[n] * on * sstep(-0.1, 0.05, f) * (1 - sstep(1.0, 1.15, f));
    hsl(rampHue(DHU[n]), 55, 80);
    put(x, y, n % 3 === 0 ? C_DOT : n % 3 === 1 ? C_PLUS : C_STAR, z, a);
  }
}

/* ---------- frame loop ---------- */
let clk = 0, lastNow = 0, state = 'start', film0 = 0, paused = false, prevT = -1;
const FILM_LEN = 12;
let SPIN = 0, SPINV = 0, STAR_HIT = -99, DEER_LEAP = -99, DEER_BOX = null;
let MOUSE_X = -999, MOUSE_Y = -999;
const GHOP = new Float64Array(5).fill(-99), GBOX = [null, null, null, null, null];

function drawScene(t) {
  const rot = t * 0.5 + SPIN, F = growF(t);
  falling(t);
  disc(t, rot);
  impact(t);
  trunk(t);
  DEER_BOX = null;
  deer(t);
  tree(t, rot, F);
  baubles(t, rot);
  ornaments(rot);
  lights(t, rot);
  ring(t, rot);
  star(t);
  comets(t);
  gifts(t, rot);
  dust(t, rot);
  drawHint(t);
}

const colCache = new Map();
function colStr(key) {
  let s = colCache.get(key);
  if (s === undefined) {
    if (colCache.size > 30000) colCache.clear();
    const a = key % 16, rgb = (key - a) / 16;
    s = 'rgba(' + ((rgb >> 16) & 255) + ',' + ((rgb >> 8) & 255) + ',' + (rgb & 255) + ',' + ((a + 1) / 16).toFixed(4) + ')';
    colCache.set(key, s);
  }
  return s;
}
function render() {
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.clearRect(0, 0, lay.width, lay.height);
  lctx.font = FONT; lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
  let last = -1;
  for (let j = 0; j < ROWS; j++) {
    const py = (Y0 + (j + 0.5) * CH) * DPR, row = j * COLS;
    for (let i = 0; i < COLS; i++) {
      const k = row + i, c = CHR[k];
      if (!c) continue;
      const key = ((CR[k] << 16) | (CG[k] << 8) | CB[k]) * 16 + (CA[k] >> 4);
      if (key !== last) { lctx.fillStyle = colStr(key); last = key; }
      lctx.fillText(GL[c], (X0 + (i + 0.5) * CW) * DPR, py);
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(lay, 0, 0);
  b1c.clearRect(0, 0, b1.width, b1.height);
  b2c.clearRect(0, 0, b2.width, b2.height);
  if (FILTER_OK) b1c.filter = 'blur(' + (0.006 * PW * DPR / 2).toFixed(2) + 'px)';
  b1c.drawImage(lay, 0, 0, b1.width, b1.height);
  if (FILTER_OK) { b1c.filter = 'none'; b2c.filter = 'blur(' + (0.02 * PW * DPR / 4).toFixed(2) + 'px)'; }
  b2c.drawImage(lay, 0, 0, b2.width, b2.height);
  if (FILTER_OK) b2c.filter = 'none';
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.4; ctx.drawImage(b1, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 0.12; ctx.drawImage(b2, 0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

function frame(now) {
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
  lastNow = now;
  if (!paused) {
    clk += dt;
    WIND += WINDV * dt; WINDV *= Math.exp(-dt * 1.2);
    if (!drag.active) { SPIN += SPINV * dt; SPINV *= Math.exp(-dt * 1.6); }
  }
  updateBeat(dt);
  if (dt > 0) {
    FT += (dt - FT) * 0.05;
    if (FT > 0.027 && STRIDE < 3) { STRIDE++; FT = 0.02; }
    else if (FT < 0.0125 && STRIDE > 1 && !(frameNo % 240)) { STRIDE--; FT = 0.02; }
  }
  frameNo++;
  CHR.fill(0); DEP.fill(-1e9); TZ.fill(-1e9); TIDX.fill(-1); MASK.fill(1);
  hq = 0;
  backdrop(clk);
  pines(clk);
  drawSnow(clk);
  drawTimer(clk);
  if (state === 'start') drawPlay(clk);
  else {
    const t = clk - film0;
    drawScene(t);
    if (!paused && t !== prevT) { runCues(prevT, t); prevT = t; }
  }
  particles();
  flushHalos(Math.floor(clk * 9));
  render();
  requestAnimationFrame(frame);
}

function startFilm() {
  audioInit();
  state = 'play'; paused = false; film0 = clk; prevT = -1; lastGrain = -1; lastTick = -1;
  SPIN = 0; SPINV = 0; STAR_HIT = -99; DEER_LEAP = -99; GHOP.fill(-99); ROCK = [];
  ORN.forEach(o => { o.born = film0 + tPass(Math.min(o.f + 0.02, 1)) + 0.3 + Math.random() * 0.3; });
  startSong();
}
const freePlay = () => state === 'play' && clk - film0 > FILM_LEN;
function togglePause() {
  paused = !paused;
  if (AC) { if (paused) AC.suspend(); else AC.resume(); }
  if (SONG) { if (paused) SONG.pause(); else if (songWanted) SONG.play().catch(() => { }); }
}

/* ---------- input ---------- */
const drag = { active: false, down: false, x: 0, y: 0, lx: 0, lt: 0, moved: 0 };
const toCell = (px, py) => [(px - X0) / CW, (py - Y0) / CH];
const inBox = (b, x, y) => b && x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];
const inTimer = (x, y) => inBox(TBOX, x, y);
function treeIndexAt(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let best = -1, bz = -1e9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = ix + dx, cy = iy + dy;
    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) continue;
    const k = cy * COLS + cx;
    if (TIDX[k] >= 0 && TZ[k] > bz) { bz = TZ[k]; best = TIDX[k]; }
  }
  return best;
}
function onCellClick(x, y) {
  if (inTimer(x, y)) {
    timerCascade();
    spawn(CX, TBOX[1] + 4, 60, -1, 20, 1.1);
    return;
  }
  if (!freePlay()) return;
  if (Math.hypot(x - (CX - 41), (y - ROWS * 0.215) / AR) < 11) { startFilm(); return; }
  const pan = clamp((x - CX) / 62, -1, 1);
  if (Math.abs(x - CX - 0.5) <= 7 && Math.abs(y - STAR - 0.5) <= 5) {
    STAR_HIT = clk; spawn(CX + 0.5, STAR + 0.5, 140, 44, 28, 1.5, 66); sfxStar(); return;
  }
  if (inBox(DEER_BOX, x, y)) {
    DEER_LEAP = clk; spawn(x, y, 40, 205, 14, 0.8, 40);
    for (let k = 0; k < 4; k++) sleigh(k * 0.12, 0.06, pan);
    return;
  }
  for (let g = 0; g < 5; g++) {
    const B = GBOX[g];
    if (!inBox(B, x, y)) continue;
    GHOP[g] = clk; spawn(B[4], B[5], 50, B[6], 15, 1.0, 80); sfxPop(pan); return;
  }
  const i = treeIndexAt(x, y);
  if (i >= 0) { addOrnament(i); sfxDecorate(PF[i], pan); return; }
  if (y < FLOOR - 4) launch(x, y);
}
function hoverCursor(x, y) {
  if (drag.active) return 'grabbing';
  if (inTimer(x, y)) return 'pointer';
  if (!freePlay()) return state === 'start' ? 'pointer' : 'default';
  return 'pointer';
}
cv.addEventListener('pointerup', e => { if (state === 'start' && e.isPrimary) startFilm(); else if (songWanted && SONG && SONG.paused && !paused) SONG.play().catch(() => { }); });
addEventListener('keydown', () => { if (songWanted && SONG && SONG.paused && !paused) SONG.play().catch(() => { }); });
document.addEventListener('visibilitychange', () => {
  if (SONG && songWanted) { if (document.hidden) SONG.pause(); else if (!paused) SONG.play().catch(() => { }); }
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (!paused) AC.resume();
});
cv.addEventListener('pointerdown', e => {
  if (state === 'start') return;
  drag.down = true; drag.active = false; drag.x = e.clientX; drag.y = e.clientY; drag.lx = e.clientX; drag.lt = performance.now(); drag.moved = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { }
});
cv.addEventListener('pointermove', e => {
  const [x, y] = toCell(e.clientX, e.clientY);
  const now = performance.now();
  if (MOUSE_X > -900) {
    const vx = (x - MOUSE_X) / Math.max(0.008, (now - (drag.mt || now - 16)) / 1000);
    WINDV = clamp(WINDV + vx * 0.04, -40, 40);
  }
  drag.mt = now; MOUSE_X = x; MOUSE_Y = y;
  const ht = inTimer(x, y);
  if (ht && !hoverTimer) timerCascade();
  hoverTimer = ht;
  if (drag.down) {
    drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y));
    if (drag.moved > 6 && freePlay()) drag.active = true;
    if (drag.active) {
      const dx = e.clientX - drag.lx, dtm = Math.max(0.008, (now - drag.lt) / 1000);
      const dr = dx / PW * 4;
      SPIN += dr; SPINV = dr / dtm;
    }
    drag.lx = e.clientX; drag.lt = now;
  }
  cv.style.cursor = hoverCursor(x, y);
});
function endDrag(e, click) {
  if (!drag.down) return;
  drag.down = false;
  if (drag.active) { drag.active = false; if (performance.now() - drag.lt > 90) SPINV = 0; return; }
  if (click) { const [x, y] = toCell(e.clientX, e.clientY); onCellClick(x, y); }
}
cv.addEventListener('pointerup', e => endDrag(e, true));
cv.addEventListener('pointercancel', e => endDrag(e, false));
cv.addEventListener('pointerleave', () => { hoverTimer = false; MOUSE_X = MOUSE_Y = -999; });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (state === 'start') startFilm(); else togglePause();
  } else if (e.key === 'Enter') {
    if (state === 'start') startFilm();
  } else if (e.key === 'r' || e.key === 'R') {
    if (state !== 'start') startFilm();
  } else if (e.key === 'm' || e.key === 'M') {
    toggleMute();
  } else if ((e.key === 'c' || e.key === 'C') && freePlay()) {
    ORN = []; saveOrn(); spawn(CX, BASE - TH * 0.5, 80, 150, 20, 1.0, 50);
  }
});
const TOUCH = matchMedia('(pointer:coarse)').matches;
let STRIDE = 1, FT = 0.016, frameNo = 0;
addEventListener('resize', layout);
layout();
decodeSong();
requestAnimationFrame(frame);
</script>
